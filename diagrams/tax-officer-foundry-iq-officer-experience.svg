<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description">
  <title id="title">Caldova CaseIQ: an officer's conversation</title>
  <desc id="description">Illustrative Teams experience, not a live screenshot. AadiK asks what needs attention in their case. The agent identifies an invoice discrepancy and a missing receipt, with document citations. The officer asks for evidence and opens a citation to review the synthetic invoice amounts: 18,450 versus 16,450, a difference of 2,000. The target uses only the officer's own approved case documents. Isolation, native citation behavior and document opening remain to be validated.</desc>
